name: release

# Push a tag like v0.2.0 to build the binaries and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}"
            out="dist/claudemeter_${GOOS}_${GOARCH}"
            [ "$GOOS" = windows ] && out="$out.exe"
            GOOS=$GOOS GOARCH=$GOARCH go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "$out" .
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "ClaudeMeter $GITHUB_REF_NAME" --generate-notes
